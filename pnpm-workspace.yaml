packages:
  - packages/*
  - examples/*

minimumReleaseAge: 1440
# Exact releases explicitly approved for this upgrade. Automatic upgrades retain the age rule.
minimumReleaseAgeExclude:
  - 'solid-js@2.0.0-rc.18'
  - '@solidjs/web@2.0.0-rc.18'
  - '@solidjs/signals@2.0.0-rc.18'
  - '@solidjs/compiler@2.0.0-rc.18'
  - '@solidjs/babel-plugin@2.0.0-rc.18'
  - '@solidjs/compiler-darwin-x64@2.0.0-rc.18'
  - '@solidjs/compiler-wasm32-wasi@2.0.0-rc.18'
  - '@solidjs/compiler-darwin-arm64@2.0.0-rc.18'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0-rc.18'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0-rc.18'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.18'
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
patchedDependencies:
  '@solid-primitives/interaction@1.0.0-next.4': patches/solid-primitives-interaction-1.0.0-next.4.patch
  '@solid-primitives/scroll@3.0.0-next.4': patches/solid-primitives-scroll-3.0.0-next.4.patch
allowBuilds:
  esbuild: true
  unrs-resolver: false

# Preserve the exact source dependency verified against the official archive.
trustPolicyExclude:
  - semver@6.3.1

# Preserve the bundler version tested in the source checkout.
overrides:
  rolldown: 1.2.8
  # Qualify the runtime and compilers together.
  '@solidjs/compiler': 2.0.0-rc.18
  '@solidjs/babel-plugin': 2.0.0-rc.18
  '@solidjs/signals': 2.0.0-rc.18
