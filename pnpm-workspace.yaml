packages:
  - packages/*
  - examples/*

minimumReleaseAge: 1440
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
patchedDependencies:
  '@solid-primitives/scroll@3.0.0-next.4': patches/solid-primitives-scroll-3.0.0-next.4.patch
allowBuilds:
  esbuild: true
  unrs-resolver: false

# Preserve the exact source dependency verified against the official archive.
trustPolicyExclude:
  - semver@6.3.1

# Preserve the bundler version tested in the source checkout.
overrides:
  rolldown: 1.2.8
