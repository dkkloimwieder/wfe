packages:
  - packages/*
  - examples/*

minimumReleaseAge: 1440
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
patchedDependencies:
  '@solid-primitives/interaction@1.0.1': patches/solid-primitives-interaction-1.0.1.patch
  '@solid-primitives/scroll@3.0.0': patches/solid-primitives-scroll-3.0.0.patch
allowBuilds:
  esbuild: true

# Preserve the exact source dependency verified against the official archive.
trustPolicyExclude:
  - semver@6.3.1

overrides:
  # Qualify the runtime and compilers together.
  '@solidjs/compiler': 2.0.3
  '@solidjs/babel-plugin': 2.0.3
  '@solidjs/signals': 2.0.4
  '@solidjs/web': 2.0.4
  solid-js: 2.0.4
