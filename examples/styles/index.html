<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>UI style isolation</title>
  </head>
  <body>
    <main id="unrelated">
      <h1>Unrelated content</h1>
      <button id="outside-button">Outside</button><input id="outside-input" />
      <div class="table-scroll">
        <table id="outside-table">
          <tbody>
            <tr>
              <td>Outside table</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <section id="light">
      <div class="case-fixture">
        <label id="light-case-label" for="light-case-input">Record name</label>
        <input
          id="light-case-input"
          value="West Coast"
          placeholder="Enter a name"
        />
        <button id="light-case-value" data-ui-text="value">West Coast</button>
        <button id="light-case-choice" class="popup-trigger">West Coast</button>
        <button class="popup-trigger">
          <span id="light-case-placeholder" data-placeholder-shown=""
            >Choose a record</span
          >
        </button>
        <button id="light-case-cell" class="cell-value">
          <span data-value>Mixed record Value</span>
        </button>
        <p id="light-case-prose">Keep this sentence in normal case.</p>
        <select id="light-case-system" data-ui-text="system">
          <option>Record order</option>
        </select>
      </div>
      <div class="filter-input">
        <input id="light-search" aria-label="light search" /><button
          id="light-clear"
          class="clear-input"
          type="button"
          aria-label="light clear"
        >
          ×
        </button>
      </div>
      <select
        id="light-select"
        class="ui-native-select"
        aria-label="light choice"
      >
        <option value="first">Choose a column</option>
        <option value="second">Second choice</option>
      </select>
      <select
        id="light-listbox"
        class="ui-native-select"
        multiple
        size="2"
        aria-label="light list"
      >
        <option>First</option>
        <option>Second</option>
      </select>
      <button id="light-button">Light</button><input /><textarea></textarea>
      <div class="table-scroll">
        <table>
          <tbody>
            <tr data-row style="height: var(--ui-row-height)">
              <td>Compact row</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <section id="dark">
      <div class="case-fixture">
        <label id="dark-case-label" for="dark-case-input">Record name</label>
        <input
          id="dark-case-input"
          value="West Coast"
          placeholder="Enter a name"
        />
        <button id="dark-case-value" data-ui-text="value">West Coast</button>
        <button id="dark-case-choice" class="popup-trigger">West Coast</button>
        <button class="popup-trigger">
          <span id="dark-case-placeholder" data-placeholder-shown=""
            >Choose a record</span
          >
        </button>
        <button id="dark-case-cell" class="cell-value">
          <span data-value>Mixed record Value</span>
        </button>
        <p id="dark-case-prose">Keep this sentence in normal case.</p>
        <select id="dark-case-system" data-ui-text="system">
          <option>Record order</option>
        </select>
      </div>
      <div class="filter-input">
        <input id="dark-search" aria-label="dark search" /><button
          id="dark-clear"
          class="clear-input"
          type="button"
          aria-label="dark clear"
        >
          ×
        </button>
      </div>
      <select
        id="dark-select"
        class="ui-native-select"
        aria-label="dark choice"
      >
        <option value="first">Choose a column</option>
        <option value="second">Second choice</option>
      </select>
      <select
        id="dark-listbox"
        class="ui-native-select"
        multiple
        size="2"
        aria-label="dark list"
      >
        <option>First</option>
        <option>Second</option>
      </select>
      <button id="dark-button">Dark</button><input />
      <div class="table-scroll">
        <table>
          <tbody>
            <tr data-row style="height: var(--ui-row-height)">
              <td>Dark row</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <section id="comfortable">
      <div class="case-fixture">
        <label id="comfortable-case-label" for="comfortable-case-input"
          >Record name</label
        >
        <input
          id="comfortable-case-input"
          value="West Coast"
          placeholder="Enter a name"
        />
        <button id="comfortable-case-value" data-ui-text="value">
          West Coast
        </button>
        <button id="comfortable-case-choice" class="popup-trigger">
          West Coast
        </button>
        <button class="popup-trigger">
          <span id="comfortable-case-placeholder" data-placeholder-shown=""
            >Choose a record</span
          >
        </button>
        <button id="comfortable-case-cell" class="cell-value">
          <span data-value>Mixed record Value</span>
        </button>
        <p id="comfortable-case-prose">Keep this sentence in normal case.</p>
        <select id="comfortable-case-system" data-ui-text="system">
          <option>Record order</option>
        </select>
      </div>
      <div class="filter-input">
        <input id="comfortable-search" aria-label="comfortable search" /><button
          id="comfortable-clear"
          class="clear-input"
          type="button"
          aria-label="comfortable clear"
        >
          ×
        </button>
      </div>
      <select
        id="comfortable-select"
        class="ui-native-select"
        aria-label="comfortable choice"
      >
        <option value="first">Choose a column</option>
        <option value="second">Second choice</option>
      </select>
      <select
        id="comfortable-listbox"
        class="ui-native-select"
        multiple
        size="2"
        aria-label="comfortable list"
      >
        <option>First</option>
        <option>Second</option>
      </select>
      <button id="comfortable-button">Comfortable</button>
      <div class="table-scroll">
        <table>
          <tbody>
            <tr data-row style="height: var(--ui-row-height)">
              <td>Comfortable row</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
